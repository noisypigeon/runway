# yaml-language-server: $schema=https://noisypigeon.garden/schemas/workload/v4.json
# The blog, at noisypigeon.com, in its zone (LIB-0037). It lives in the zone's
# project, and the zone's hosts give it the apex and www. Its site is served
# by noisypigeon/pigeon's workloads/noisypigeon.com/blog, so runway no longer
# deploys it.
workload:
  name: blog
  # Kept for this PR's first stage, which restores the deployers'
  # permissions; its second stage removes it.
  deployments:
    cloudflare: {}
  # The deployer keeps R2 write until this PR's destroys are applied; a
  # follow-up drops this entry for the default.
  cloudflare:
    deployer:
      policies:
        - { permission_groups: [Zone Read, DNS Write], zones: [noisypigeon.com] }
        - { permission_groups: [Workers R2 Storage Write], account: true }
