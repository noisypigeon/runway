# yaml-language-server: $schema=https://noisypigeon.garden/schemas/workload/v1.json
# garden's old workload, being torn down (LIB-0037 §7): the site and its two
# Pages CNAMEs moved to workloads/noisypigeon.garden/garden/, whose state
# took over the records. Only its implicit project, deployer, state bucket
# and token remain, until the whole workload is removed. The state bucket
# force-destroys, so its leftover object versions don't block that.
prefix: garden
suffix: noisypigeon
scaleway:
  state:
    force_destroy: true
cloudflare:
  zone: noisypigeon.garden
