# yaml-language-server: $schema=https://noisypigeon.garden/schemas/workload/v4.json
# garden, at noisypigeon.garden, in its zone (LIB-0037). It lives in the
# zone's project, and the zone's hosts give it the apex and www. githubPages
# deploys it through noisypigeon/noisypigeon.garden and implies its two Pages
# CNAMEs, whose state moved here from workloads/garden/: change one only on
# purpose.
workload:
  name: garden
  deployments:
    # LIB-0051 §4 step 2, the flip, first apply: githubPages goes, so its two
    # Pages CNAMEs are destroyed and free the apex and www for R2. The next
    # commit adds the apex and www to hosts, keeping r2-test so that apply
    # destroys nothing while garden is down (LIB-0051 amendment 8).
    cloudflare:
      hosts: [r2-test]
