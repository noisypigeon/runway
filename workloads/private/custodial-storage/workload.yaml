# yaml-language-server: $schema=https://noisypigeon.garden/schemas/workload/v4.json
# custodial-storage: the custodial bucket on Backblaze, in a project of its
# own, so no other deployer can reach its state (LIB-0044). It has no zone, so
# it lives under private/. Its bucket signs in with the workload's own B2 key,
# which the spoke's breakglass key mints (LIB-0041).
workload:
  name: custodial-storage
  deployments:
    scaleway:
      project:
        name: custodial-storage
        prefix: cus
        suffix: custodial-storage
  # The entry writes its old leaf's own name parts, so its name doesn't
  # change; the random code moved with its state (LIB-0044 §3).
  backblaze:
    bucket:
      custodial-duck-jellyfish:
        name_prefix: custodial
        name_suffix: duck-jellyfish
        description: "Custodial bucket: files held for Duck Jellyfish (alias)."
