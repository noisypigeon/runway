# yaml-language-server: $schema=https://noisypigeon.garden/schemas/workload/v4.json
# personal-cold-storage: the personal cold-storage buckets on Backblaze,
# backups and pigeon-cli's snapshots (LIB-0040, LIB-0044). It has no zone, so
# it lives under private/ in its own project, wg-personal-cold-storage, whose
# only job is to hold the buckets' state. The custodial bucket is
# custodial-cold-storage's. The buckets sign in with the workload's own B2 key
# (LIB-0041).
workload:
  name: personal-cold-storage
  deployments:
    scaleway:
      project:
        prefix: wg
        suffix: personal-cold-storage
  # Each entry writes its old leaf's own name parts, so its name doesn't
  # change; the random code moved with its state (LIB-0040 §§1, 4).
  backblaze:
    bucket:
      deduplicated-misc:
        name_prefix: wg
        name_suffix: deduplicated-misc
        description: Non-document, non-media unique files from pigeon-cli deduplication.
      original-2026-06-01:
        name_prefix: wg
        name_suffix: original-2026-06-01
        description: "Original non-deduplicated consolidated backup. (Approx: June 1st, 2026)"
      snapshot-2026-10-09:
        name_prefix: wg
        name_suffix: snapshot-2026-10-09
        description: "Unique documents and media files from pigeon-cli deduplication (Snapshot: October 9th, 2026)"
      snapshot-2026-10-17:
        name_prefix: wg
        name_suffix: snapshot-2026-10-17
        description: "Unique documents and media files from pigeon-cli transform (Snapshot: October 17th, 2026)"
