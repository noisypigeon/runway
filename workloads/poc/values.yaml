# yaml-language-server: $schema=https://noisypigeon.garden/schemas/workload/v1.json
# LIB-0023's proof of concept, being torn down: its bucket, application and
# API keys are gone, and only its implicit project, deployer and state bucket
# (LIB-0028) remain, until the whole workload is removed. The state bucket
# force-destroys, so its leftover object versions don't block that.
prefix: poc
suffix: lib-0023
scaleway:
  project:
    description: LIB-0023 workload proof of concept
  state:
    force_destroy: true
