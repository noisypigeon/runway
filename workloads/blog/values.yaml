# yaml-language-server: $schema=https://noisypigeon.garden/schemas/workload/v1.json
# The blog, at noisypigeon.com (LIB-0032). The zone names it, so it writes
# the site's own records there; the domain's mail and identity records, and
# the redirects to it, are the zones' (LIB-0036). githubPages names the shim
# that deploys the site, and implies its two Pages CNAMEs (LIB-0034).
prefix: blog
suffix: noisypigeon
features:
  githubPages:
    pagesShim: noisypigeon/noisypigeon.com
    pagesBaseUrl: noisypigeon.github.io
cloudflare:
  zone: noisypigeon.com
