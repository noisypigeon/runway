# yaml-language-server: $schema=https://noisypigeon.garden/schemas/zone/v3.json
# noisypigeon.garden, a unit of its own (LIB-0036). The garden lives in this
# project and writes its Pages records here (LIB-0037).
zone:
  name: noisypigeon.garden
  prefix: npg
  suffix: noisypigeon
  # garden, in workloads/noisypigeon.garden/garden/, serves the apex and www
  # (LIB-0037).
  hosts:
    "@": garden
