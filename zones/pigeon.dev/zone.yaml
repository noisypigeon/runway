# yaml-language-server: $schema=https://noisypigeon.garden/schemas/zone/v3.json
# pigeon.dev, a unit of its own (LIB-0036). Its Fastmail records follow from
# its services (LIB-0039), without DMARC, which it has never served. They and
# its redirect to noisypigeon.com were imported from the blog, not created:
# change one only on purpose.
zone:
  name: pigeon.dev
  prefix: pd
  suffix: noisypigeon
  services:
    fastmail:
      enabled: true
      dmarc: false
  cloudflare:
    apexRedirect:
      main:
        target_url: https://noisypigeon.com
