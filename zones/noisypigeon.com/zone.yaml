# yaml-language-server: $schema=https://noisypigeon.garden/schemas/zone/v3.json
# noisypigeon.com, a unit of its own (LIB-0036). Its project is named for the
# domain; its other resources use prefix. The blog lives in this project and
# writes its Pages records here (LIB-0037). The domain's mail and identity
# records follow from its services (LIB-0039), and were imported from the
# blog, not created: change one only on purpose.
zone:
  name: noisypigeon.com
  prefix: npc
  suffix: noisypigeon
  # blog, in workloads/noisypigeon.com/blog/, serves the apex and www
  # (LIB-0037).
  hosts:
    "@": blog
  services:
    proton:
      enabled: true
      verification:
        pm: yulfrkphygclvbkaipymgmyhstrxuj
        protonmail: e9457a054010bbbb12cc4abfce39d67198e9abd1
    googleSearch:
      enabled: true
      verification: vFu1wL_0hoMl6UpTkWZ3IiVSlfOvGuY_wtYfpWOrsfA
    bluesky:
      enabled: true
      did: did:plc:kkh3qo4rjs4b6aayzj4fcpkg
