# Deploys garden to its R2 bucket, served on noisypigeon.garden and www, and
# checks it there against LIB-0051 §1. It runs on a change to garden, which
# includes garden-generate.yml's commits (LIB-0051 amendment 9).
name: site-r2-garden

on:
  push:
    branches: [main]
    paths:
      - "workloads/noisypigeon.garden/garden/**"
      - ".github/workflows/site-r2-garden.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    uses: noisypigeon/runway/.github/workflows/site-r2.yml@github/workflows/v10.2.0
    with:
      src_dir: workloads/noisypigeon.garden/garden
      base_url: https://noisypigeon.garden
      www_url: https://www.noisypigeon.garden
    secrets: inherit
