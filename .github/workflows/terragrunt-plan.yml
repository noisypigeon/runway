name: Terragrunt plan

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: terragrunt-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  detect:
    uses: noisypigeon/library/.github/workflows/terragrunt-detect.yml@workflows/v3.1.0
    with:
      leaf_pattern: '^terraform/|^root\.hcl$|^spoke\.hcl$|^\.sops\.yaml$'

  plan:
    needs: detect
    if: needs.detect.outputs.affects-leaves == 'true'
    uses: noisypigeon/library/.github/workflows/terragrunt-run.yml@workflows/v3.1.0
    with:
      command: plan
      prepare_cmd: ./fetch-lib.sh && .lib-src/.github/scripts/resolve-root-hcl.sh --check && .lib-src/.github/scripts/check-secrets.sh
    secrets: inherit
