name: Terragrunt plan

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  detect:
    if: github.event_name == 'pull_request'
    uses: noisypigeon/library/.github/workflows/terragrunt-detect.yml@workflows/v7.1.0
    with:
      leaf_pattern: '^terraform/|^workloads/[^/]+/(values|secrets)\.yaml$|^workloads/[^/]+/[^/]+/(workload|secrets\.workload)\.yaml$|^zones/[^/]+/zone\.yaml$|^zones\.yaml$|^root\.hcl$|^spoke\.hcl$|^\.sops\.yaml$'

  # 👀 on a `terragrunt plan` comment at once (LIB-0022's 2026-10-25
  # amendment), in no concurrency group. A push has no comment to react to.
  ack:
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      github.event.comment.body == 'terragrunt plan' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    uses: noisypigeon/library/.github/workflows/terragrunt-ack.yml@workflows/v7.1.0

  # On a push, or on a `terragrunt plan` comment, gated like apply (LIB-0022).
  plan:
    needs: detect
    if: >
      always() && (
        (github.event_name == 'pull_request' && needs.detect.outputs.affects-leaves == 'true') ||
        (github.event_name == 'issue_comment' &&
          github.event.issue.pull_request != null &&
          github.event.comment.body == 'terragrunt plan' &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
      )
    # On the job, not the workflow: every PR comment starts this workflow, and
    # a workflow-level group's one pending slot would let any comment cancel a
    # queued run. Shared with terragrunt-apply.yml, so a PR never plans and
    # applies at once.
    concurrency:
      group: terragrunt-pr-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    uses: noisypigeon/library/.github/workflows/terragrunt-run.yml@workflows/v7.1.0
    with:
      command: plan
      prepare_cmd: ./fetch-lib.sh && .lib-src/.github/scripts/resolve-root-hcl.sh --check && .lib-src/.github/scripts/check-secrets.sh && .lib-src/.github/scripts/resolve-workloads.sh --check
    secrets: inherit
