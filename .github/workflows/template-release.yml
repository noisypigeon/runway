name: template-release

# Releases the library, which is runway's tools/ (LIB-0047, LIB-0050). A
# unit's tag is its path under tools/: tools/static-site/zola is tagged
# static-site/zola/vX.Y.Z, and tools/terraform/<p>/<m> terraform/<p>/<m>/vX.Y.Z.
# A unit renamed by LIB-0050 continues its old track's numbers through the
# continues-from line in its CHANGELOG.md (latest-version.sh). The workflows
# and the marketplace are the exceptions: GitHub and Claude Code read them only
# at the repo root, so their tags name a commit off main that copies them there
# (LIB-0049 §§2, 4).
on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - "tools/**"
      - ".github/workflows/**"

permissions:
  contents: write

# Its own group, not a shared main-writer one. GitHub keeps at most ONE
# pending run per concurrency group and cancels any previously-pending run
# when a third arrives -- so three workflows sharing a group means a .tf
# merge (which triggers all three) silently loses one of them. That cost a
# real module release: pigeon-lib#9 was cancelled while pending, between
# root-changelog starting and module-docs arriving. Serialization against
# the other main writers is handled by the push retry below instead.
concurrency:
  group: main-writer-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      # The newest main, not the merge commit. A changelog written on the merge
      # commit conflicts with any line another run pushed after it -- which is
      # how two releases merged back to back failed (#92). fetch-depth: 0 keeps
      # the merge commit reachable, so detection still diffs it by SHA.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.BOT_GITHUB_TOKEN }}

      - name: Determine bump level from PR labels
        id: bump
        env:
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels) }}
        run: |
          if echo "$LABELS_JSON" | jq -e '.[] | select(.name=="release:major")' >/dev/null; then
            echo "level=major" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS_JSON" | jq -e '.[] | select(.name=="release:minor")' >/dev/null; then
            echo "level=minor" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS_JSON" | jq -e '.[] | select(.name=="release:patch")' >/dev/null; then
            echo "level=patch" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No release:* label found on PR #${{ github.event.pull_request.number }}; defaulting to patch."
            echo "level=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine changed module directories
        id: modules
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        working-directory: tools
        run: |
          CHANGED_FILES=$(git diff --relative --name-only "${MERGE_SHA}~1" "$MERGE_SHA")

          MODULE_DIRS=$(find terraform -mindepth 3 -maxdepth 3 -name versions.tf -printf '%h\n' | sort)

          CHANGED_MODULES=""
          for dir in $MODULE_DIRS; do
            if echo "$CHANGED_FILES" | grep -qE "^${dir}/.*\.tf$"; then
              CHANGED_MODULES="$CHANGED_MODULES $dir"
            fi
          done

          echo "changed=${CHANGED_MODULES# }" >> "$GITHUB_OUTPUT"

      - name: Determine zola-site change
        id: zola_site
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        working-directory: tools
        run: |
          CHANGED_FILES=$(git diff --relative --name-only "${MERGE_SHA}~1" "$MERGE_SHA")
          if echo "$CHANGED_FILES" | grep -qE '^static-site/zola/(templates/|static/|theme\.toml$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # The spokes' root.hcl template (LIB-0003). Only the template itself and
      # the secrets schema it reads (LIB-0010) are a release; its README.md and
      # CHANGELOG.md are not, as with the theme.
      - name: Determine root.hcl template change
        id: root_hcl
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        working-directory: tools
        run: |
          CHANGED_FILES=$(git diff --relative --name-only "${MERGE_SHA}~1" "$MERGE_SHA")
          if echo "$CHANGED_FILES" | grep -qE '^github/terragrunt/(root\.hcl|secrets-schema\.json)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Per-set release tracks, one per set directory, each tagged
      # <its path>/vX.Y.Z:
      #   - observability/dashboards/<set>/*.json (LIB-0004's willowgraysen.com
      #     adoption), consumed by URL at its tag. Only the JSON is a release.
      #   - observability/<stack>/ (pigeon-cli's CLI-0161), a local Docker
      #     Compose stack, consumed by checking out its tag. Depth tells a
      #     stack from a dashboard set (LIB-0050 §2).
      #   - claude/plugins/<set>/ (pigeon-cli's CLI-0161), a Claude Code
      #     plugin listed in tools/claude/plugins/marketplace.json, consumed by
      #     pinning the marketplace to its tag, whose commit copies that file
      #     to /.claude-plugin/ (LIB-0049 §4).
      # A set's README.md/CHANGELOG.md are never a release on their own.
      - name: Determine changed per-set release tracks
        id: dashboards
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        working-directory: tools
        run: |
          CHANGED_FILES=$(git diff --relative --name-only "${MERGE_SHA}~1" "$MERGE_SHA")
          SETS=$({
            echo "$CHANGED_FILES" | grep -E '^observability/dashboards/[^/]+/[^/]+\.json$' | cut -d/ -f1-3
            echo "$CHANGED_FILES" | grep -E '^observability/[^/]+/.+' | grep -vE '^observability/dashboards/' \
              | grep -vE '^observability/[^/]+/(README|CHANGELOG)\.md$' | cut -d/ -f1-2
            echo "$CHANGED_FILES" | grep -E '^claude/plugins/[^/]+/.+' \
              | grep -vE '^claude/plugins/[^/]+/(README|CHANGELOG)\.md$' | cut -d/ -f1-3
          } | sort -u | tr '\n' ' ')
          echo "changed=${SETS% }" >> "$GITHUB_OUTPUT"

      # The spokes call the reusable workflows and fetch root-changelog.sh, so
      # tools/github/workflows/, scripts/ and policies/ travel under one version -- LIB-0001 invariant 2 says a
      # spoke pins a version rather than tracking a branch, and DEV-0155 deferred
      # exactly this track on the grounds that live @main was cheaper. It is no
      # longer cheaper now that three spokes consume it.
      #
      # CHANGELOG.md is excluded: the automation writes it, and a release must
      # not be able to trigger itself.
      - name: Determine reusable-CI change
        id: workflows
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          CHANGED_FILES=$(git diff --name-only "${MERGE_SHA}~1" "$MERGE_SHA")
          # A path, not a look inside the file: every reusable workflow lives
          # in tools/github/workflows/, and none of runway's own does (LIB-0049 §1).
          if echo "$CHANGED_FILES" | grep -qE '^tools/github/(workflows/[^/]+\.yml$|scripts/|policies/)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git identity
        if: steps.modules.outputs.changed != '' || steps.zola_site.outputs.changed == 'true' || steps.workflows.outputs.changed == 'true' || steps.root_hcl.outputs.changed == 'true' || steps.dashboards.outputs.changed != ''
        run: |
          git config user.name "istx25"
          git config user.email "6799989+istx25@users.noreply.github.com"

      - name: Update changelogs and compute versions
        id: versions
        if: steps.modules.outputs.changed != ''
        env:
          BUMP: ${{ steps.bump.outputs.level }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          CHANGED_MODULES: ${{ steps.modules.outputs.changed }}
        working-directory: tools
        run: |
          TODAY=$(TZ="America/Los_Angeles" date +%Y-%m-%d)
          TAGS=""

          for dir in $CHANGED_MODULES; do
            # A renamed module continues its old track (latest-version.sh).
            LATEST=$(github/scripts/latest-version.sh "$dir")

            if [ -z "$LATEST" ]; then
              NEXT="0.1.0"
            else
              MA=$(echo "$LATEST" | cut -d. -f1)
              MI=$(echo "$LATEST" | cut -d. -f2)
              PA=$(echo "$LATEST" | cut -d. -f3)
              case "$BUMP" in
                major) NEXT="$((MA+1)).0.0" ;;
                minor) NEXT="${MA}.$((MI+1)).0" ;;
                patch) NEXT="${MA}.${MI}.$((PA+1))" ;;
              esac
            fi

            CHANGELOG="${dir}/CHANGELOG.md"
            if [ ! -f "$CHANGELOG" ]; then
              cat > "$CHANGELOG" <<'HEADER'
          # Changelog

          All notable changes to this module are documented in this file.

          One line per release; its full notes are its GitHub Release (LIB-0049 §7).
          HEADER
            fi

            # One line per release, the PR title (LIB-0049 §7). The PR body is the
            # Release's notes, below.
            ENTRY=$(mktemp)
            {
              echo ""
              echo "## [${NEXT}] - ${TODAY}"
              echo ""
              echo "- ${PR_TITLE} ([#${PR_NUMBER}](${PR_URL}))"
            } > "$ENTRY"

            head -n 5 "$CHANGELOG" > "${CHANGELOG}.new"
            cat "$ENTRY" >> "${CHANGELOG}.new"
            tail -n +6 "$CHANGELOG" >> "${CHANGELOG}.new"
            mv "${CHANGELOG}.new" "$CHANGELOG"

            git add "$CHANGELOG"
            TAGS="$TAGS ${dir}/v${NEXT}"

            # Also add a one-liner to the repo-wide root CHANGELOG.md (DEV-0160).
            # Passing --date reuses the $TODAY above, so the rollup line and this
            # module's own entry can never straddle a midnight boundary.
            github/scripts/root-changelog.sh \
              --tag "${dir#terraform/}" \
              --title "$PR_TITLE" \
              --number "$PR_NUMBER" \
              --url "$PR_URL" \
              --date "$TODAY" \
              --file ../CHANGELOG.md
            git add ../CHANGELOG.md
          done

          echo "tags=${TAGS# }" >> "$GITHUB_OUTPUT"

      - name: Update zola-site changelog and compute version
        id: zola_site_version
        if: steps.zola_site.outputs.changed == 'true'
        env:
          BUMP: ${{ steps.bump.outputs.level }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        working-directory: tools
        run: |
          TODAY=$(TZ="America/Los_Angeles" date +%Y-%m-%d)
          DIR="static-site/zola"

          LATEST=$(github/scripts/latest-version.sh "$DIR")

          if [ -z "$LATEST" ]; then
            NEXT="1.0.0"
          else
            MA=$(echo "$LATEST" | cut -d. -f1)
            MI=$(echo "$LATEST" | cut -d. -f2)
            PA=$(echo "$LATEST" | cut -d. -f3)
            case "$BUMP" in
              major) NEXT="$((MA+1)).0.0" ;;
              minor) NEXT="${MA}.$((MI+1)).0" ;;
              patch) NEXT="${MA}.${MI}.$((PA+1))" ;;
            esac
          fi

          CHANGELOG="${DIR}/CHANGELOG.md"
          if [ ! -f "$CHANGELOG" ]; then
            cat > "$CHANGELOG" <<'HEADER'
          # Changelog

          All notable changes to this theme are documented in this file.

          One line per release; its full notes are its GitHub Release (LIB-0049 §7).
          HEADER
          fi

          # One line per release, the PR title (LIB-0049 §7). The PR body is the
          # Release's notes, below.
          ENTRY=$(mktemp)
          {
            echo ""
            echo "## [${NEXT}] - ${TODAY}"
            echo ""
            echo "- ${PR_TITLE} ([#${PR_NUMBER}](${PR_URL}))"
          } > "$ENTRY"

          head -n 5 "$CHANGELOG" > "${CHANGELOG}.new"
          cat "$ENTRY" >> "${CHANGELOG}.new"
          tail -n +6 "$CHANGELOG" >> "${CHANGELOG}.new"
          mv "${CHANGELOG}.new" "$CHANGELOG"
          git add "$CHANGELOG"

          # One-liner into the root CHANGELOG.md, same contract as above (DEV-0160).
          github/scripts/root-changelog.sh \
            --tag "static-site/zola" \
            --title "$PR_TITLE" \
            --number "$PR_NUMBER" \
            --url "$PR_URL" \
            --date "$TODAY" \
            --file ../CHANGELOG.md
          git add ../CHANGELOG.md

          echo "tag=${DIR}/v${NEXT}" >> "$GITHUB_OUTPUT"

      - name: Update root.hcl template changelog and compute version
        id: root_hcl_version
        if: steps.root_hcl.outputs.changed == 'true'
        env:
          BUMP: ${{ steps.bump.outputs.level }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        working-directory: tools
        run: |
          TODAY=$(TZ="America/Los_Angeles" date +%Y-%m-%d)
          DIR="github/terragrunt"

          LATEST=$(github/scripts/latest-version.sh "$DIR")

          if [ -z "$LATEST" ]; then
            NEXT="1.0.0"
          else
            MA=$(echo "$LATEST" | cut -d. -f1)
            MI=$(echo "$LATEST" | cut -d. -f2)
            PA=$(echo "$LATEST" | cut -d. -f3)
            case "$BUMP" in
              major) NEXT="$((MA+1)).0.0" ;;
              minor) NEXT="${MA}.$((MI+1)).0" ;;
              patch) NEXT="${MA}.${MI}.$((PA+1))" ;;
            esac
          fi

          CHANGELOG="${DIR}/CHANGELOG.md"
          if [ ! -f "$CHANGELOG" ]; then
            cat > "$CHANGELOG" <<'HEADER'
          # Changelog

          All notable changes to this template are documented in this file.

          One line per release; its full notes are its GitHub Release (LIB-0049 §7).
          HEADER
          fi

          # One line per release, the PR title (LIB-0049 §7). The PR body is the
          # Release's notes, below.
          ENTRY=$(mktemp)
          {
            echo ""
            echo "## [${NEXT}] - ${TODAY}"
            echo ""
            echo "- ${PR_TITLE} ([#${PR_NUMBER}](${PR_URL}))"
          } > "$ENTRY"

          head -n 5 "$CHANGELOG" > "${CHANGELOG}.new"
          cat "$ENTRY" >> "${CHANGELOG}.new"
          tail -n +6 "$CHANGELOG" >> "${CHANGELOG}.new"
          mv "${CHANGELOG}.new" "$CHANGELOG"
          git add "$CHANGELOG"

          github/scripts/root-changelog.sh \
            --tag "github/terragrunt" \
            --title "$PR_TITLE" \
            --number "$PR_NUMBER" \
            --url "$PR_URL" \
            --date "$TODAY" \
            --file ../CHANGELOG.md
          git add ../CHANGELOG.md

          echo "tag=${DIR}/v${NEXT}" >> "$GITHUB_OUTPUT"

      - name: Update per-set changelogs and compute versions
        id: dashboards_version
        if: steps.dashboards.outputs.changed != ''
        env:
          BUMP: ${{ steps.bump.outputs.level }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          CHANGED_SETS: ${{ steps.dashboards.outputs.changed }}
        working-directory: tools
        run: |
          TODAY=$(TZ="America/Los_Angeles" date +%Y-%m-%d)
          TAGS=""

          for dir in $CHANGED_SETS; do
            LATEST=$(github/scripts/latest-version.sh "$dir")

            if [ -z "$LATEST" ]; then
              NEXT="1.0.0"
            else
              MA=$(echo "$LATEST" | cut -d. -f1)
              MI=$(echo "$LATEST" | cut -d. -f2)
              PA=$(echo "$LATEST" | cut -d. -f3)
              case "$BUMP" in
                major) NEXT="$((MA+1)).0.0" ;;
                minor) NEXT="${MA}.$((MI+1)).0" ;;
                patch) NEXT="${MA}.${MI}.$((PA+1))" ;;
              esac
            fi

            CHANGELOG="${dir}/CHANGELOG.md"
            if [ ! -f "$CHANGELOG" ]; then
              cat > "$CHANGELOG" <<'HEADER'
          # Changelog

          All notable changes to this release unit are documented in this file.

          One line per release; its full notes are its GitHub Release (LIB-0049 §7).
          HEADER
            fi

            # One line per release, the PR title (LIB-0049 §7). The PR body is the
            # Release's notes, below.
            ENTRY=$(mktemp)
            {
              echo ""
              echo "## [${NEXT}] - ${TODAY}"
              echo ""
              echo "- ${PR_TITLE} ([#${PR_NUMBER}](${PR_URL}))"
            } > "$ENTRY"

            head -n 5 "$CHANGELOG" > "${CHANGELOG}.new"
            cat "$ENTRY" >> "${CHANGELOG}.new"
            tail -n +6 "$CHANGELOG" >> "${CHANGELOG}.new"
            mv "${CHANGELOG}.new" "$CHANGELOG"
            git add "$CHANGELOG"
            TAGS="$TAGS ${dir}/v${NEXT}"

            github/scripts/root-changelog.sh \
              --tag "$dir" \
              --title "$PR_TITLE" \
              --number "$PR_NUMBER" \
              --url "$PR_URL" \
              --date "$TODAY" \
              --file ../CHANGELOG.md
            git add ../CHANGELOG.md
          done

          echo "tags=${TAGS# }" >> "$GITHUB_OUTPUT"

      - name: Update reusable-CI changelog and compute version
        id: workflows_version
        if: steps.workflows.outputs.changed == 'true'
        env:
          BUMP: ${{ steps.bump.outputs.level }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          TODAY=$(TZ="America/Los_Angeles" date +%Y-%m-%d)

          LATEST=$(cd tools && github/scripts/latest-version.sh github/workflows)

          if [ -z "$LATEST" ]; then
            NEXT="1.0.0"
          else
            MA=$(echo "$LATEST" | cut -d. -f1)
            MI=$(echo "$LATEST" | cut -d. -f2)
            PA=$(echo "$LATEST" | cut -d. -f3)
            case "$BUMP" in
              major) NEXT="$((MA+1)).0.0" ;;
              minor) NEXT="${MA}.$((MI+1)).0" ;;
              patch) NEXT="${MA}.${MI}.$((PA+1))" ;;
            esac
          fi

          # Lives beside the workflows it versions (LIB-0049 §1).
          CHANGELOG="tools/github/workflows/CHANGELOG.md"
          if [ ! -f "$CHANGELOG" ]; then
            cat > "$CHANGELOG" <<'HEADER'
          # Changelog

          All notable changes to the reusable CI are documented in this file.

          One line per release; its full notes are its GitHub Release (LIB-0049 §7).
          HEADER
          fi

          # One line per release, the PR title (LIB-0049 §7). The PR body is the
          # Release's notes, below.
          ENTRY=$(mktemp)
          {
            echo ""
            echo "## [${NEXT}] - ${TODAY}"
            echo ""
            echo "- ${PR_TITLE} ([#${PR_NUMBER}](${PR_URL}))"
          } > "$ENTRY"

          head -n 5 "$CHANGELOG" > "${CHANGELOG}.new"
          cat "$ENTRY" >> "${CHANGELOG}.new"
          tail -n +6 "$CHANGELOG" >> "${CHANGELOG}.new"
          mv "${CHANGELOG}.new" "$CHANGELOG"
          git add "$CHANGELOG"

          tools/github/scripts/root-changelog.sh \
            --tag "github/workflows" \
            --title "$PR_TITLE" \
            --number "$PR_NUMBER" \
            --url "$PR_URL" \
            --date "$TODAY"
          git add CHANGELOG.md

          echo "tag=github/workflows/v${NEXT}" >> "$GITHUB_OUTPUT"

      - name: Commit changelog updates
        if: steps.modules.outputs.changed != '' || steps.zola_site.outputs.changed == 'true' || steps.workflows.outputs.changed == 'true' || steps.root_hcl.outputs.changed == 'true' || steps.dashboards.outputs.changed != ''
        run: |
          git commit -m "chore: update changelog(s) for PR #${{ github.event.pull_request.number }}"
          # Retry rather than fail on a rejected push: these writers no longer
          # share a concurrency group, so two of them can legitimately race for
          # main. This run wrote on the newest main, so a rebase conflict needs
          # another workflow's changelog line pushed in the seconds since the
          # checkout. The changelogs are written across several steps and can't
          # simply be rewritten here, so that conflict stays fatal.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::rebase onto origin/main conflicted; refusing to guess"
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}/5); another writer won the race."
            sleep $((attempt * 5))
          done
          echo "::error::could not push to main after 5 attempts"
          exit 1

      - name: Tag and release each changed module/theme/CI version
        if: steps.modules.outputs.changed != '' || steps.zola_site.outputs.changed == 'true' || steps.workflows.outputs.changed == 'true' || steps.root_hcl.outputs.changed == 'true' || steps.dashboards.outputs.changed != ''
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RELEASE_TAGS: ${{ steps.versions.outputs.tags }} ${{ steps.zola_site_version.outputs.tag }} ${{ steps.workflows_version.outputs.tag }} ${{ steps.root_hcl_version.outputs.tag }} ${{ steps.dashboards_version.outputs.tags }}
        run: |
          NOTES=$(mktemp)
          printf '%s\n\nPR: %s\n' "$PR_BODY" "$PR_URL" > "$NOTES"

          # Prints a child of HEAD that also holds each "<src> <dest>" pair
          # given, src copied to dest. Built in a scratch index, so the working
          # tree and main are untouched, and only the tag that names it is
          # pushed (LIB-0049 §§2, 4). A dest main already holds is a collision.
          release_commit() {
            local tag="$1"; shift
            export GIT_INDEX_FILE
            GIT_INDEX_FILE="$(mktemp -u)"
            git read-tree HEAD
            while [ $# -gt 0 ]; do
              if git cat-file -e "HEAD:$2" 2>/dev/null; then
                echo "::error::$1 collides with runway's own $2; rename one" >&2
                exit 1
              fi
              git update-index --add --cacheinfo "100644,$(git hash-object -w "$1"),$2"
              shift 2
            done
            git commit-tree "$(git write-tree)" -p HEAD -m "chore(release): ${tag}"
            rm -f "$GIT_INDEX_FILE"
            unset GIT_INDEX_FILE
          }

          for tag in $RELEASE_TAGS; do
            case "$tag" in
              github/workflows/*)
                # GitHub runs a reusable workflow only from .github/workflows/
                # at the ref it is called at, so the tag's commit copies them
                # there. Pushing it needs BOT_GITHUB_TOKEN to carry the
                # workflows permission.
                pairs=()
                for f in tools/github/workflows/*.yml; do
                  pairs+=("$f" ".github/workflows/$(basename "$f")")
                done
                # An assignment, so a collision's exit fails the step.
                commit=$(release_commit "$tag" "${pairs[@]}")
                git tag "$tag" "$commit"
                ;;
              claude/plugins/*)
                # Claude Code reads a github marketplace from the repo root,
                # so the tag's commit copies it there.
                commit=$(release_commit "$tag" tools/claude/plugins/marketplace.json .claude-plugin/marketplace.json)
                git tag "$tag" "$commit"
                ;;
              *)
                git tag "$tag"
                ;;
            esac
            git push origin "$tag"
            gh release create "$tag" --title "$tag" --notes-file "$NOTES"
          done

      # noisypigeon.garden's module redirect pages, overview pages,
      # theme-version pages, release posts and schemas are generated and
      # committed in this repo's workloads/noisypigeon.garden/garden/
      # (LIB-0035 §§2, 4), so every release dispatches garden-generate.yml
      # here. Since LIB-0047 that is no longer a cross-repo dispatch. Its commit
      # deploys itself, through runway's sites.yml and the
      # noisypigeon/noisypigeon.garden shim; a release that changes no page
      # commits nothing and deploys nothing. noisypigeon/noisypigeon.com only
      # renders with the theme, so it rebuilds on a theme release only.
      #
      # Runs *after* the tags are pushed above: the generator reads this
      # repo's tag list, so dispatching first would race the tag into
      # existence.
      #
      # Both need BOT_GITHUB_TOKEN to carry actions: write on their repo, this
      # one and noisypigeon/noisypigeon.com. If it doesn't, these steps fail
      # loudly -- which is the point. A missed dispatch leaves a version
      # tagged and released here whose short URL 404s on the site.
      - name: Trigger garden generation
        if: steps.modules.outputs.changed != '' || steps.zola_site.outputs.changed == 'true' || steps.workflows.outputs.changed == 'true' || steps.root_hcl.outputs.changed == 'true' || steps.dashboards.outputs.changed != ''
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: gh workflow run garden-generate.yml -R "$GITHUB_REPOSITORY" --ref main

      # Replaces a dispatch at zola-sites-deploy.yml in noisypigeon/noisypigeon,
      # which DEV-0159 removed from that repo -- so this step had been failing
      # on every theme release until LIB-0002 repointed it here. The shim was
      # renamed from noisypigeon/blog, and every shim's deploy is pages.yml
      # (LIB-0034 §§4, 6).
      - name: Trigger noisypigeon.com Pages deploy
        if: steps.zola_site.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: gh workflow run pages.yml -R noisypigeon/noisypigeon.com --ref main
