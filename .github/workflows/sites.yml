# Each site workload's files live here, in workloads/<zone>/<w>/, but deploy
# from its Pages shim: Pages only deploys the repo the workflow runs in
# (DEV-0156). So a change to a site dispatches the pages.yml of the shim its
# workload.yaml's deployments.githubPages implies, which builds this repo's
# main (LIB-0031 §4, LIB-0037 §4).
name: Sites

on:
  push:
    branches: ["main"]
    paths:
      - "workloads/**"
      - "!workloads/*/values.yaml"
      - "!workloads/*/secrets.yaml"
      - "!workloads/*/*/workload.yaml"
      - "!workloads/*/*/secrets.workload.yaml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dispatch:
    uses: noisypigeon/library/.github/workflows/site-dispatch.yml@workflows/v8.1.0
    secrets: inherit
