name: scripts-test

# Runs the Node tests beside the library's scripts, render-run-comments.test.js
# among them (LIB-0026 §6), on any PR that touches .github/scripts/. This is
# the library's own CI, not a reusable workflow: no spoke calls it.

# Disabled for the hoist (LIB-0047's 2026-10-28 amendment, item 1): on the
# merge that brings lib/ in, every path is new, so this would act on every
# unit. The rewiring PR restores the trigger with lib/ paths.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run the scripts' tests
        run: node --test .github/scripts/*.test.js
