name: scripts-test

# Runs the Node tests beside the library's scripts, render-run-comments.test.js
# among them (LIB-0026 §6), on any PR that touches tools/github/scripts/. This is
# the library's own CI, not a reusable workflow: no spoke calls it. It also
# checks that every reusable workflow lives in tools/github/workflows/, and none
# in .github/workflows/ (LIB-0049 §1), and that terragrunt-run.yml never
# prints the raw Terraform output (LIB-0054 §4).

on:
  pull_request:
    paths:
      - "tools/github/scripts/**"
      - "tools/github/policies/**"
      - "tools/github/workflows/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run the scripts' tests
        run: node --test tools/github/scripts/*.test.js

  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reusable workflows live only in tools/github/workflows/
        run: |
          status=0
          for f in .github/workflows/*.yml; do
            if grep -qE '^  workflow_call:' "$f"; then
              echo "::error file=${f}::a reusable workflow belongs in tools/github/workflows/ (LIB-0049 §1)"
              status=1
            fi
          done
          for f in tools/github/workflows/*.yml; do
            if ! grep -qE '^  workflow_call:' "$f"; then
              echo "::error file=${f}::tools/github/workflows/ holds only reusable workflows (LIB-0049 §1)"
              status=1
            fi
            if [ -e ".github/workflows/$(basename "$f")" ]; then
              echo "::error file=${f}::collides with .github/workflows/$(basename "$f"); the release copies it there"
              status=1
            fi
          done
          exit "$status"

      # The raw Terraform output carries identifiers, so it reaches only the
      # comment renderer, which redacts them, never the job log (LIB-0054 §4).
      - name: The raw Terraform output stays out of the job log
        run: |
          if grep -nE '\b(cat|head|tail|tee|less|more)\b[^#]*output\.txt' tools/github/workflows/terragrunt-run.yml; then
            echo "::error file=tools/github/workflows/terragrunt-run.yml::output.txt must not be printed to the job log (LIB-0054 §4)"
            exit 1
          fi
