name: scripts-test

# Runs the Node tests beside the library's scripts, render-run-comments.test.js
# among them (LIB-0026 §6), on any PR that touches lib/scripts/. This is
# the library's own CI, not a reusable workflow: no spoke calls it.

on:
  pull_request:
    paths:
      - "lib/scripts/**"
      - ".github/workflows/scripts-test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run the scripts' tests
        run: node --test lib/scripts/*.test.js
