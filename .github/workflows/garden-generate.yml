# garden's module redirect pages, theme-version pages, release posts and
# schemas are generated from the library's tags and changelogs, and committed
# under workloads/noisypigeon.garden/garden/ (LIB-0035 §2, LIB-0037).
# template-release dispatches this on every library release; run it by hand to
# regenerate. Its commit lands outside workload.yaml, so sites.yml then deploys
# it through noisypigeon/noisypigeon.garden.
name: garden-generate

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: main-writer
  cancel-in-progress: false

jobs:
  generate:
    uses: noisypigeon/runway/.github/workflows/site-generate.yml@workflows/v9.4.2
    with:
      src_dir: workloads/noisypigeon.garden/garden
      generate_cmd: ".lib-src/lib/scripts/generate-module-redirects.sh --content-root workloads/noisypigeon.garden/garden/content --static-root workloads/noisypigeon.garden/garden/static"
    secrets: inherit
