# garden's module redirect pages, theme-version pages, release posts and
# schemas are generated from the library's tags and changelogs, and committed
# under workloads/noisypigeon.garden/garden/ (LIB-0035 §2, LIB-0037).
# template-release dispatches this on every library release, and a change to
# .config/version runs it too; run it by hand to regenerate. Its commit
# changes garden, so site-r2-garden.yml then deploys it (LIB-0051).
name: garden-generate

on:
  # Taking a new library version can change what the generator writes, so a
  # change to the pin regenerates garden too (LIB-0051's amendment).
  push:
    branches: [main]
    paths:
      - ".config/version"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: main-writer
  cancel-in-progress: false

jobs:
  generate:
    uses: noisypigeon/runway/.github/workflows/site-generate.yml@github/workflows/v11.0.1
    with:
      src_dir: workloads/noisypigeon.garden/garden
      generate_cmd: ".config/src/tools/github/scripts/generate-module-redirects.sh --content-root workloads/noisypigeon.garden/garden/content --static-root workloads/noisypigeon.garden/garden/static"
    secrets: inherit
