name: Renew interaction limits

# Keeps this public repo at a contributors_only interaction limit (RUN-0000).
# GitHub auto-expires the limit after six months, so this re-applies it monthly.
# Job body lives in noisypigeon/pigeon-lib; a cron trigger can't live in
# another repo. Needs GH_ADMIN_TOKEN, a token with admin on this repo.
on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  renew:
    uses: noisypigeon/pigeon-lib/.github/workflows/interaction-limits-renew.yml@workflows/v3.0.0
    secrets: inherit
