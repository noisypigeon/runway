name: root-changelog

# Every merged PR gets exactly one line in the root CHANGELOG.md (DEV-0160,
# adopted here by RUN-0000). This repo has no site and no long-form changelog,
# so this workflow is the root file's only writer.
#
# A thin caller: the job body -- fetch the library, pick the tag, run
# root-changelog.sh, push with retry -- lives in the library's
# spoke-root-changelog.yml, at the version /.lib-version pins. This file keeps
# only the trigger, the merged-only gate, permissions, concurrency, and this
# repo's tag precedence.
#
# Deliberately no `paths:` filter: the whole point is that no merged PR is
# exempt.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

# Own group, as in library: GitHub keeps one pending run per group, so a
# shared group can silently drop a writer. The reusable retries a rejected push.
concurrency:
  group: main-writer-rollup
  cancel-in-progress: false

jobs:
  rollup:
    if: github.event.pull_request.merged == true
    uses: noisypigeon/library/.github/workflows/spoke-root-changelog.yml@workflows/v3.1.0
    with:
      # First match wins.
      precedence: |
        ^(terraform/|root\.hcl$|spoke\.hcl$|\.sops\.yaml$)=terraform
        ^adr/=adr
        ^\.github/=ci
    secrets: inherit
