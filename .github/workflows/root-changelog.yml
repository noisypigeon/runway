name: root-changelog

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

# Its own group: a shared one can silently drop a pending writer.
concurrency:
  group: main-writer-rollup
  cancel-in-progress: false

jobs:
  # template-release.yml writes the root line for a PR that releases a library
  # unit (LIB-0047). Its detection predicates are duplicated here on purpose so
  # that no PR ever gets two lines, or none: change one copy and you change its
  # twin (DEV-0160, LIB-0002; library#301). Paths are runway's, so each unit's
  # predicate carries tools/.
  releases:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.check.outputs.releases }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Does this PR release a library unit?
        id: check
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          CHANGED_FILES=$(git diff --name-only "${MERGE_SHA}~1" "$MERGE_SHA")
          if echo "$CHANGED_FILES" | grep -qE '^tools/terraform/[^/]+/[^/]+/.*\.tf$' \
            || echo "$CHANGED_FILES" | grep -qE '^tools/static-site/zola/(templates/|static/|theme\.toml$)' \
            || echo "$CHANGED_FILES" | grep -qE '^tools/github/terragrunt/(root\.hcl|secrets-schema\.json)$' \
            || echo "$CHANGED_FILES" | grep -qE '^tools/observability/dashboards/[^/]+/[^/]+\.json$' \
            || echo "$CHANGED_FILES" | grep -E '^tools/observability/[^/]+/.+' | grep -vE '^tools/observability/dashboards/' \
                 | grep -qvE '^tools/observability/[^/]+/(README|CHANGELOG)\.md$' \
            || echo "$CHANGED_FILES" | grep -E '^tools/claude/plugins/[^/]+/.+' \
                 | grep -qvE '^tools/claude/plugins/[^/]+/(README|CHANGELOG)\.md$' \
            || echo "$CHANGED_FILES" | grep -qE '^tools/github/(workflows/[^/]+\.yml$|scripts/|policies/)'; then
            echo "This PR releases a library unit; template-release.yml writes its root entry."
            echo "releases=true" >> "$GITHUB_OUTPUT"
          else
            echo "releases=false" >> "$GITHUB_OUTPUT"
          fi

  rollup:
    needs: releases
    if: github.event.pull_request.merged == true && needs.releases.outputs.releases == 'false'
    uses: noisypigeon/runway/.github/workflows/spoke-root-changelog.yml@github/workflows/v10.0.0
    with:
      # First match wins.
      precedence: |
        ^(terraform/|root\.hcl$|spoke\.hcl$|\.sops\.yaml$)=terraform
        ^tools/docs/adr/=adr
        ^tools/docs/runbooks/=docs
        ^tools/=tools
        ^\.github/=ci
    secrets: inherit
