name: root-changelog

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

# Its own group: a shared one can silently drop a pending writer.
concurrency:
  group: main-writer-rollup
  cancel-in-progress: false

jobs:
  rollup:
    if: github.event.pull_request.merged == true
    uses: noisypigeon/library/.github/workflows/spoke-root-changelog.yml@workflows/v6.0.0
    with:
      # First match wins.
      precedence: |
        ^(terraform/|root\.hcl$|spoke\.hcl$|\.sops\.yaml$)=terraform
        ^\.github/=ci
    secrets: inherit
