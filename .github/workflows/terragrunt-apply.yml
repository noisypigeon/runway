name: Terragrunt apply

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  # 👀 on the comment at once (LIB-0022's 2026-10-25 amendment). Gated like
  # apply, and in no concurrency group, so it never waits for a run in
  # progress on this PR.
  ack:
    if: >
      github.event.issue.pull_request != null &&
      github.event.comment.body == 'terragrunt apply' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    uses: noisypigeon/runway/.github/workflows/terragrunt-ack.yml@github/workflows/v11.2.0

  apply:
    # This gate is all that stands between a PR comment and real infrastructure.
    if: >
      github.event.issue.pull_request != null &&
      github.event.comment.body == 'terragrunt apply' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    # On the job, not the workflow: every PR comment starts this workflow, and
    # a workflow-level group's one pending slot would let any comment cancel a
    # queued run. Shared with terragrunt-plan.yml, so a PR never plans and
    # applies at once.
    concurrency:
      group: terragrunt-pr-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    uses: noisypigeon/runway/.github/workflows/terragrunt-run.yml@github/workflows/v11.2.0
    with:
      command: apply
      prepare_cmd: ./.config/tools.sh && .config/src/tools/github/scripts/resolve-root-hcl.sh --check && .config/src/tools/github/scripts/check-secrets.sh && WORKLOAD_SCHEMA_DIR=workloads/noisypigeon.garden/garden/static .config/src/tools/github/scripts/resolve-workloads.sh --check && .config/src/tools/github/scripts/check-policies.sh
    secrets: inherit

  # After an apply that left workload leaves deferred, plan the next stage
  # without a `terragrunt plan` comment (LIB-0027). Each stage still needs its
  # own `terragrunt apply`.
  replan:
    needs: apply
    if: needs.apply.result == 'success' && needs.apply.outputs.deferred == 'true'
    concurrency:
      group: terragrunt-pr-${{ github.event.issue.number }}
      cancel-in-progress: false
    uses: noisypigeon/runway/.github/workflows/terragrunt-run.yml@github/workflows/v11.2.0
    with:
      command: plan
      prepare_cmd: ./.config/tools.sh && .config/src/tools/github/scripts/resolve-root-hcl.sh --check && .config/src/tools/github/scripts/check-secrets.sh && WORKLOAD_SCHEMA_DIR=workloads/noisypigeon.garden/garden/static .config/src/tools/github/scripts/resolve-workloads.sh --check && .config/src/tools/github/scripts/check-policies.sh
    secrets: inherit
