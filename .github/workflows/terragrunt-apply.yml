name: Terragrunt apply

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: terragrunt-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  apply:
    # This gate is all that stands between a PR comment and real infrastructure.
    if: >
      github.event.issue.pull_request != null &&
      github.event.comment.body == 'terragrunt apply' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    uses: noisypigeon/library/.github/workflows/terragrunt-run.yml@workflows/v3.1.0
    with:
      command: apply
      checkout_ref: refs/pull/${{ github.event.issue.number }}/head
      prepare_cmd: ./fetch-lib.sh && .lib-src/.github/scripts/resolve-root-hcl.sh --check && .lib-src/.github/scripts/check-secrets.sh
    secrets: inherit
