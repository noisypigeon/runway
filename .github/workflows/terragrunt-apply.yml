name: Terragrunt apply

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  apply:
    # This gate is all that stands between a PR comment and real infrastructure.
    if: >
      github.event.issue.pull_request != null &&
      github.event.comment.body == 'terragrunt apply' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    # On the job, not the workflow: every PR comment starts this workflow, and
    # a workflow-level group's one pending slot would let any comment cancel a
    # queued run. Shared with terragrunt-plan.yml, so a PR never plans and
    # applies at once.
    concurrency:
      group: terragrunt-pr-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    uses: noisypigeon/library/.github/workflows/terragrunt-run.yml@workflows/v4.1.0
    with:
      command: apply
      checkout_ref: refs/pull/${{ github.event.issue.number }}/head
      prepare_cmd: ./fetch-lib.sh && .lib-src/.github/scripts/resolve-root-hcl.sh --check && .lib-src/.github/scripts/check-secrets.sh
    secrets: inherit
