# The blog's one-line changelog entry and daily digest, written into
# workloads/noisypigeon.com/blog/ and then deployed through
# noisypigeon/noisypigeon.com (LIB-0031 §6, LIB-0034 §5, LIB-0037).
name: blog-changelog

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - "workloads/noisypigeon.com/blog/**"
      - "!workloads/noisypigeon.com/blog/workload.yaml"
      - "!workloads/noisypigeon.com/blog/secrets.workload.yaml"

permissions:
  contents: write
  actions: write

concurrency:
  group: main-writer
  cancel-in-progress: false

jobs:
  changelog:
    if: github.event.pull_request.merged == true
    uses: noisypigeon/runway/.github/workflows/blog-changelog.yml@workflows/v9.4.2
    with:
      src_dir: workloads/noisypigeon.com/blog
      # root_changelog_tag stays unset, or a blog PR would get two root lines.
      changelog_path: workloads/noisypigeon.com/blog/CHANGELOG.md
      deploy_workflow: pages.yml
      deploy_repo: noisypigeon/noisypigeon.com
    secrets: inherit
