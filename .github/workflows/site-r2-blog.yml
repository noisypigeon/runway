# Deploys the blog to its R2 bucket, served on noisypigeon.com and www, and
# checks it there against LIB-0051 §1. It folds into sites.yml once garden
# has moved too (LIB-0051 §5).
name: site-r2-blog

on:
  push:
    branches: [main]
    paths:
      - "workloads/noisypigeon.com/blog/**"
      - ".github/workflows/site-r2-blog.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    uses: noisypigeon/runway/.github/workflows/site-r2.yml@github/workflows/v10.1.3
    with:
      src_dir: workloads/noisypigeon.com/blog
      base_url: https://noisypigeon.com
      www_url: https://www.noisypigeon.com
    secrets: inherit
