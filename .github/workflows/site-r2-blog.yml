# Deploys the blog to its R2 bucket, served on noisypigeon.com and www, and
# checks it there against LIB-0051 §1. It runs on a change to the blog, and
# template-release.yml dispatches it on a theme release (LIB-0051 amendment 9).
name: site-r2-blog

on:
  push:
    branches: [main]
    paths:
      - "workloads/noisypigeon.com/blog/**"
      - ".github/workflows/site-r2-blog.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    uses: noisypigeon/runway/.github/workflows/site-r2.yml@github/workflows/v11.2.0
    with:
      src_dir: workloads/noisypigeon.com/blog
      base_url: https://noisypigeon.com
      www_url: https://www.noisypigeon.com
    secrets: inherit
