[tools]
terraform = "1.16.3"
terragrunt = "1.1.6"
sops = "3.13.3"

[env]
# terragrunt defaults to invoking `tofu`; this family standardizes on Terraform.
TG_TF_PATH = "terraform"

# root.hcl is generated from pigeon-lib's terragrunt/root-hcl template at the
# version spoke.hcl pins and committed (LIB-0003); terraform-prepare regenerates
# it, so after bumping root_hcl_version, run it and commit the diff.
[tasks.terraform-prepare]
run = [
  "./fetch-lib.sh",
  ".lib-src/.github/scripts/resolve-root-hcl.sh",
]

[tasks.plan]
depends = ["terraform-prepare"]
run = "terragrunt run --all -- plan"

[tasks.apply]
depends = ["terraform-prepare"]
run = "terragrunt run --all -- apply"

[tasks.fmt-terraform]
run = ["terragrunt hcl format", "terraform fmt -recursive terraform"]

[tasks.fmt-check-terraform]
run = ["terragrunt hcl format --check", "terraform fmt -recursive -check terraform"]

[tasks.secrets-edit]
usage = 'arg "<file>" help="terraform, cloudflare, scaleway, backblaze or env"'
run = "sops --input-type dotenv --output-type dotenv terraform/secrets/{{arg(name=\"file\")}}.enc"
