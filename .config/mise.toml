[tools]
terraform = "1.16.3"
terragrunt = "1.1.6"
sops = "3.13.3"
yq = "4.44.3"

[env]
# terragrunt defaults to `tofu`.
TG_TF_PATH = "terraform"

[tasks.terraform-prepare]
run = [
  "./.config/tools.sh",
  ".config/src/tools/github/scripts/resolve-root-hcl.sh",
  ".config/src/tools/github/scripts/resolve-workloads.sh",
  ".config/src/tools/github/scripts/check-policies.sh",
]

[tasks.plan]
depends = ["terraform-prepare"]
run = "terragrunt run --all -- plan"

[tasks.apply]
depends = ["terraform-prepare"]
run = "terragrunt run --all -- apply"

[tasks.fmt-terraform]
run = ["terragrunt hcl format", "terraform fmt -recursive terraform", "terraform fmt -recursive tools/terraform"]

[tasks.fmt-check-terraform]
run = ["terragrunt hcl format --check", "terraform fmt -recursive -check terraform", "terraform fmt -recursive -check tools/terraform"]

[tasks.secrets-edit]
usage = 'arg "<file>" help="terraform, cloudflare, scaleway, backblaze, env, cloudflare_breakglass or backblaze_breakglass"'
run = "sops --config .config/sops.yaml --input-type dotenv --output-type dotenv terraform/secrets/{{arg(name=\"file\")}}.enc"

[tasks.secrets-edit-workload]
usage = 'arg "<workload>" help="A directory under workloads/"'
run = "sops --config .config/sops.yaml workloads/{{arg(name=\"workload\")}}/secrets.yaml"
